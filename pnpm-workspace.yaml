packages:
  - frontend
  - e2e

# Supply-chain defense (2026-09-11): refuse any version younger than 30
# days — direct AND transitive — covering both Dependabot PRs and manual
# `pnpm add`/`update` (verified: ERR_PNPM_NO_MATURE_MATCHING_VERSION).
minimumReleaseAge: 43200
# Urgent-fix path. Dependabot security updates bypass its cooldown by
# design, but a patched version is itself newly published, so installing it
# here needs an exclude entry. Procedure (verified on the tse 8.70.0 train):
# enumerate exact `name@version` pins for every package in the fix train —
# transitive packages stay gated otherwise; the install error names the
# next missing one each time. Version-pinned only: name patterns with
# versions are rejected (ERR_PNPM_INVALID_MINIMUM_RELEASE_AGE_EXCLUDE);
# an unpinned org pattern (`@org/*`) works but admits the whole org — use
# only to get unstuck, then replace with pins. Each entry carries a dated
# comment naming the advisory; remove entries once the versions age out.
minimumReleaseAgeExclude:
  # 2026-09-14: already-locked rollup 4.63.1 platform binaries (no advisory —
  # re-resolution for @tanstack/react-virtual tripped the age gate on packages
  # the lockfile pins). Remove once 4.63.1 is 30+ days old (2026-09-28).
  - "@rollup/rollup-android-arm64@4.63.1"
  - "@noble/hashes@2.4.0"
  - "@rollup/rollup-android-arm-eabi@4.63.1"
  - "@rollup/rollup-darwin-arm64@4.63.1"
  - "@rollup/rollup-darwin-x64@4.63.1"
  - "@rollup/rollup-freebsd-arm64@4.63.1"
  - "@rollup/rollup-freebsd-x64@4.63.1"
  - "@rollup/rollup-linux-arm64-gnu@4.63.1"
  - "@rollup/rollup-linux-arm64-musl@4.63.1"
  - "@rollup/rollup-linux-arm-gnueabihf@4.63.1"
  - "@rollup/rollup-linux-arm-musleabihf@4.63.1"
  - "@rollup/rollup-linux-loong64-gnu@4.63.1"
  - "@rollup/rollup-linux-loong64-musl@4.63.1"
  - "@rollup/rollup-linux-ppc64-gnu@4.63.1"
  - "@rollup/rollup-linux-ppc64-musl@4.63.1"
  - "@rollup/rollup-linux-riscv64-gnu@4.63.1"
  - "@rollup/rollup-linux-riscv64-musl@4.63.1"
  - "@rollup/rollup-linux-s390x-gnu@4.63.1"
  - "@rollup/rollup-linux-x64-gnu@4.63.1"
  - "@rollup/rollup-linux-x64-musl@4.63.1"
  - "@rollup/rollup-openbsd-x64@4.63.1"
  - "@rollup/rollup-openharmony-arm64@4.63.1"
  - "@rollup/rollup-win32-arm64-msvc@4.63.1"
  - "@rollup/rollup-win32-ia32-msvc@4.63.1"
  - "@rollup/rollup-win32-x64-gnu@4.63.1"
  - "@rollup/rollup-win32-x64-msvc@4.63.1"

# pnpm 10 blocks dependency postinstall scripts by default.
onlyBuiltDependencies:
  # esbuild's install script places its platform binary; the Vite build needs it.
  - esbuild
  # electron's postinstall downloads the runtime binary for the platform.
  - electron
