packages:
  - frontend
  - e2e

# Supply-chain defense (2026-09-11): refuse any version younger than 30
# days — direct AND transitive — covering both Dependabot PRs and manual
# `pnpm add`/`update` (verified: ERR_PNPM_NO_MATURE_MATCHING_VERSION).
minimumReleaseAge: 43200
# Urgent-fix path. Dependabot security updates bypass its cooldown by
# design, but a patched version is itself newly published, so installing it
# here needs an exclude entry. Procedure (verified on the tse 8.70.0 train):
# enumerate exact `name@version` pins for every package in the fix train —
# transitive packages stay gated otherwise; the install error names the
# next missing one each time. Version-pinned only: name patterns with
# versions are rejected (ERR_PNPM_INVALID_MINIMUM_RELEASE_AGE_EXCLUDE);
# an unpinned org pattern (`@org/*`) works but admits the whole org — use
# only to get unstuck, then replace with pins. Each entry carries a dated
# comment naming the advisory; remove entries once the versions age out.
minimumReleaseAgeExclude:
  # 2026-10-22: vite-plus@1.3.0 adoption (the stable unified toolchain this
  # migration installs). vite-plus 1.3.0 shipped 2026-10-16 and its resolved
  # dependency train is younger than the 30-day floor. Main packages are
  # exact-pinned; the binding/binary packages are admitted via scoped
  # patterns — safe because their parents pin them exactly (=1.88.0,
  # =0.73.0, =1.2.14, =7.0.2004, =1.3.0), so nothing newer can slip in.
  # Remove everything in this block once the versions age out
  # (~2026-11-21); the install error names any member it misses.
  - "vite-plus@1.3.0"
  - "@voidzero-dev/vite-plus-*"
  - "vitest@5.0.5"
  - "@vitest/coverage-v8@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/utils@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/istanbul-lib-coverage@1.0.2"
  - "@vitest/istanbul-lib-report@1.0.2"
  - "rolldown@1.2.14"
  - "rolldown-plugin-dts@0.28.8"
  - "oxlint@1.88.0"
  - "oxlint-tsgolint@7.0.2004"
  - "oxfmt@0.73.0"
  - "tsdown@0.23.1"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
  - "@rolldown/*"
  - "@oxc-project/runtime@0.154.0"
  - "@oxc-project/types@0.154.0"
  - "yuku-parser@0.19.0"
  - "yuku-core@0.19.0"
  - "@yuku-core/*"
  - "@yuku-toolchain/types@0.19.0"
  - "postcss@8.5.31"
  - "nanoid@3.3.20"
  - "ws@8.22.0"
  - "chai@6.3.0"
  - "cac@7.1.0"
  - "es-module-lexer@3.0.4"
  - "magic-string@1.4.3"
  - "tinybench@6.2.2"
  - "tinyrainbow@3.2.0"
  - "std-env@4.3.0"
  # 2026-10-21: vite GHSA-587h-7wmj-h5pm (high, dev-only build tool; npm
  # files it against vite 7.3.6 via launch-editor). 7.3.7 fixes, and the
  # repo's ^7.1.0 range already admits it. Remove 2026-11-05.
  - "vite@7.3.7"
  # 2026-10-22: hono GHSA-5r4p-p66f-jhc7 (moderate; serveStatic
  # double-decodes the request path, bypassing middleware on static paths).
  # Dev-only: hono reaches the tree through @modelcontextprotocol/sdk (and
  # its @hono/node-server dep) under shadcn's CLI. 4.13.11 fixes, and
  # ^4.11.4 resolves to 4.13.13. Remove 2026-11-03.
  - "hono@4.13.13"
  # 2026-10-12: security fix train for the 2026-09-18 advisories blocking
  # `just audit` before the 0.0.20 release. Every patched version is younger
  # than the 30-day floor, and all are transitive, so the pins are exact.
  # Remove each once it is 30+ days old.
  # brace-expansion GHSA-qhr7-859c-m2p7 + GHSA-6j4f-fj2g-mc7p (high, dev-only
  # glob tooling): 1.1.21/2.1.7/5.0.12 fix both; one entry, versions joined
  # with `||` (same-name entries do not stack). Remove 2026-10-14.
  - "brace-expansion@1.1.21 || 2.1.7 || 5.0.12"
  # proxy-addr GHSA-jqcg-44mw-7w3h (critical; express in shadcn's dev-only
  # MCP server). 2.0.8 fixes. Remove 2026-10-15.
  - "proxy-addr@2.0.8"
  # ip-address GHSA-j6r3-76f7-8jcv + GHSA-h3mg-xc3c-68pw (medium; socks in
  # shadcn's dev tooling). 10.7.1 fixes both. Remove 2026-10-15.
  - "ip-address@10.7.1"
  # http-cache-semantics GHSA-ch52-4w7c-c8xp (high; got in @electron/get,
  # dev-only electron download). Affected <=4.2.0; 4.3.0 is outside the
  # range. Remove 2026-11-03.
  - "http-cache-semantics@4.3.0"
  # source-map-js GHSA-68fv-2mgg-jv7q (high; tailwind/jsdom/coverage build
  # chain). 1.2.2 fixes. Remove 2026-10-30.
  - "source-map-js@1.2.2"
  # @modelcontextprotocol/sdk GHSA-6qxp-vccf-f47h (high; shadcn dev tool).
  # >=1.31.0 fixes; ^1.26.0 resolves to 1.32.1. Remove 2026-11-04.
  - "@modelcontextprotocol/sdk@1.32.1"
  # 2026-09-14: already-locked @noble/hashes 2.4.0 (no advisory —
  # re-resolution for @tanstack/react-virtual tripped the age gate on a
  # package the lockfile pins). The rollup 4.63.1 pins that shared this
  # comment aged out and were removed on 2026-10-12.
  - "@noble/hashes@2.4.0"

# pnpm 10 blocks dependency postinstall scripts by default.
onlyBuiltDependencies:
  # esbuild's install script places its platform binary; the Vite build needs it.
  - esbuild
  # electron's postinstall downloads the runtime binary for the platform.
  - electron
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
