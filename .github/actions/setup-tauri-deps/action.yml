name: Set up Tauri build dependencies
description: >-
  Installs the apt packages Tauri needs on Linux, backed by a cache of the
  downloaded .deb archives so repeat runs skip the network entirely (also
  immune to slow apt mirrors).

inputs:
  packages:
    description: Extra apt packages to install beyond the Tauri baseline
    required: false
    default: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

runs:
  using: composite
  steps:
    - name: Cache apt archives
      uses: actions/cache@v5
      with:
        # A user-owned workspace dir, NOT /var/cache/apt/archives: that dir
        # holds root-owned lock/partial entries the runner user cannot read,
        # which breaks both cache restore and save. One entry per job so a
        # job's superset (e.g. xvfb for E2E) never races a smaller one.
        path: .apt-cache
        key: apt-noble-tauri-${{ github.job }}-v1

    - name: Install apt packages
      shell: bash
      run: |
        mkdir -p .apt-cache
        sudo apt-get update
        # Point apt's archive cache at the cached dir: .debs already present
        # are reused and only missing ones are downloaded.
        sudo apt-get install -y \
          -o Dir::Cache::archives="$GITHUB_WORKSPACE/.apt-cache" \
          ${{ inputs.packages }}
        # apt leaves root-owned lock/partial behind; drop them so the
        # post-run cache save can archive the directory cleanly.
        sudo rm -f .apt-cache/lock
        sudo rm -rf .apt-cache/partial
