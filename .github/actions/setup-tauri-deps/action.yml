name: Set up Tauri build dependencies
description: >-
  Installs the apt packages Tauri needs on Linux, backed by a cache of the
  downloaded .deb archives so repeat runs skip the network entirely (also
  immune to slow apt mirrors).

inputs:
  packages:
    description: Extra apt packages to install beyond the Tauri baseline
    required: false
    default: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

runs:
  using: composite
  steps:
    - name: Cache apt archives
      uses: actions/cache@v4
      with:
        # Directory-level cache: extra .debs a sibling job saved are simply
        # ignored by apt, so all jobs can share one cache entry.
        path: /var/cache/apt/archives
        # Bump v1 -> v2 if the runner image baseline ever shifts in a way
        # that makes old .debs incompatible.
        key: apt-noble-tauri-v1

    - name: Install apt packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.packages }}
