name: E2E (manual)

# Optional, not a required branch-protection check. Add the `run-e2e` label
# to a PR, or dispatch this workflow with a PR number, to run the same
# real-binary E2E suite the release verify job uses. The suite takes several
# minutes; ordinary PRs stay on the fast unit/lint/typecheck gate.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test. Leave empty to test the selected branch."
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (manual)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - id: target
        name: Resolve the target commit
        env:
          GH_TOKEN: ${{ github.token }}
          # This step runs before actions/checkout, so the workspace has no
          # .git yet and gh cannot discover the repository from git. GH_REPO
          # tells gh which repository `gh pr view` means.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            sha="$EVENT_SHA"
          else
            sha="$HEAD_SHA"
          fi
          if [ -z "$sha" ]; then
            echo "::error::could not resolve a commit to test"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # Electron cache (see ci.yml's frontend job): vp install's electron
      # postinstall fetches the runtime zip from GitHub releases, which has
      # 504'd and failed `vp install` inside setup-vp (PR #399). Restoring
      # the cache first makes that download local on every run after the
      # first; the key follows the lockfile and builder config that pin the
      # version.
      - name: Electron cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, pnpm, and the frozen dependencies (vp install runs frozen
      # under CI); cache: true caches the package-manager store. just
      # recipes call bare vp and pnpm --filter internally, which works with
      # the managed pnpm.
      - uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      # just comes from scripts/install-just.sh (the install-actionlint.sh
      # house pattern: pinned + checksum-verified tarball, curl retry sized
      # for GitHub-releases 504 brownouts, which exhausted setup-just's
      # built-in retries twice — PRs #399, #400).
      - name: Install just
        run: |
          bash scripts/install-just.sh
          echo "$GITHUB_WORKSPACE/.build/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      # Re-run speedup: restore Vite Task's result cache so frontend:build
      # (which every e2e phase's build-debug depends on) replays from a
      # previous run of this PR. Within one job the phases already share the
      # runner-local cache; this covers fresh runners. Restored entries from
      # an older commit simply miss and re-run for real. Restored after
      # setup-vp because vp install can recreate node_modules.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # Cache the fetched PDFium library across runs: the GitHub-releases
      # download has 504'd here (PR #399). Exact key only — no restore-keys:
      # the key follows fetch-pdfium.sh, which pins the build, and a stale
      # entry from a different build would be silently accepted by the
      # script's already-present check.
      - name: PDFium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: sidecar/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-pdfium.sh') }}

      - name: E2E (headless)
        run: |
          bash scripts/fetch-pdfium.sh
          just test-e2e

      # The rolling key makes every successful run save a fresh immutable
      # entry; the restore prefix above picks the newest one next time.
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts-pr
          path: artifacts/e2e
          if-no-files-found: ignore
