name: Release

# Tags are immutable release points. Cut a release by: bumping the version
# in all manifests on main, drafting the release notes for that version
# (scripts/release-notes.sh) and committing them with the bump, letting CI
# go green, then tagging that commit (e.g. `git tag -a v0.1.1 && git
# push origin v0.1.1`). The workflow refuses a tag outside main, waits for
# approval of the `release` environment, and refuses to publish unless the
# tag exactly matches the version bundled below and the committed notes
# file exists. A stale or reused version, or a forgotten New/Changed/Fixed
# note, can never produce a release. See docs/RELEASE.md and the versioning
# policy under Milestone 11 in ROADMAP.md.

on:
  push:
    tags: ["v*"]

# The release job publishes with a write token; everything before it only
# reads. Publishing also waits on the `release` environment, which requires
# a reviewer and only accepts `v*` tags.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag commit (E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A tag can point at any commit. Refuse one outside main so a release
      # can only be cut from the CI-gated line (docs/RELEASE.md "Cutting a
      # release").
      - name: Check tag commit is on main
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $commit, which is not on main"
            exit 1
          fi

      # xvfb is the only OS-level dependency the headless E2E suite needs
      # (docs/TESTING.md): Playwright launches the local Electron binary,
      # there is no external browser driver.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # Electron cache (see ci.yml's frontend job): vp install's electron
      # postinstall fetches the runtime zip from GitHub releases, which has
      # 504'd and failed `vp install` inside setup-vp (PR #399). Restoring
      # the cache first makes that download local on every run after the
      # first; the key follows the lockfile and builder config that pin the
      # version.
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, pnpm, and the frozen dependencies (vp install runs frozen
      # under CI); cache: true caches the package-manager store. just
      # recipes call bare vp and pnpm --filter internally, which works with
      # the managed pnpm.
      - name: Install vp toolchain
        uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      # just comes from scripts/install-just.sh (the install-actionlint.sh
      # house pattern: pinned + checksum-verified tarball, curl retry sized
      # for GitHub-releases 504 brownouts, which exhausted setup-just's
      # built-in retries twice — PRs #399, #400).
      - name: Install just
        run: |
          bash scripts/install-just.sh
          echo "$GITHUB_WORKSPACE/.build/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      # Cache the fetched PDFium library across runs: the GitHub-releases
      # download has 504'd in CI (PR #399). Exact key only — no restore-keys:
      # the key follows fetch-pdfium.sh, which pins the build, and a stale
      # entry from a different build would be silently accepted by the
      # script's already-present check.
      - name: Cache PDFium library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: sidecar/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-pdfium.sh') }}

      # CI already ran the unit/integration suites (Rust and frontend) on the
      # commit this tag points at, and a tag is cut on a CI-gated commit on
      # main. This job adds the part CI never runs: the real-binary headless
      # E2E suites, so a tag never publishes what has not been proven.
      - name: Run headless E2E suite
        run: |
          bash scripts/fetch-pdfium.sh
          just test-e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  publish:
    name: Release build (deb, pacman, AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [verify]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # electron-builder re-downloads Electron and its helper tooling on every
      # release. Cache the downloads; the key follows the lockfile and
      # builder config that pin the versions. Restored before setup-vp so
      # vp install's electron postinstall reads the warm cache too.
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, pnpm, and the frozen dependencies (vp install runs frozen
      # under CI); cache: true caches the package-manager store. just
      # recipes call bare vp and pnpm --filter internally, which works with
      # the managed pnpm.
      - name: Install vp toolchain
        uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      # just comes from scripts/install-just.sh (see the verify job): pinned
      # + checksum-verified tarball whose curl retry rides out the
      # GitHub-releases 504 brownouts that killed setup-just twice.
      - name: Install just
        run: |
          bash scripts/install-just.sh
          echo "$GITHUB_WORKSPACE/.build/bin" >> "$GITHUB_PATH"

      # The pinned-glibc sidecar container builds under BuildKit; this gives
      # its layer cache a home in the Actions cache.
      - name: Set up Buildx (sidecar container cache)
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Check tag matches bundled version
        run: |
          declared="$(jq -r .version package.json)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the bundled version $declared"
            echo "::error::bump the version on main, let CI go green, then tag that commit"
            exit 1
          fi
          echo "Releasing $tagged"

      # The deb, pacman and AppImage targets are self-contained (the rpm,
      # which needs rpmbuild, stays a local `just package` artifact).
      # electron-builder builds pacman packages with fpm, which needs bsdtar
      # (for .MTREE) and zstd (the tarball). Debian/Ubuntu ship bsdtar in
      # libarchive-tools. AppImage bundling runs FUSE-free via
      # APPIMAGE_EXTRACT_AND_RUN. The published image embeds AppImage's
      # static type2-runtime, so running it needs no host libfuse2, only a
      # fusermount3 helper (or the extract-and-run fallback).
      - name: Install pacman packaging tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools zstd

      # deb for Ubuntu/Debian (primary target), pacman for Arch/Manjaro,
      # AppImage for other Linux setups. The rpm stays a local `just package`
      # artifact; the site's audience is Ubuntu. electron-builder wires the
      # sidecar binary and the PDFium library into resources/sidecar
      # (electron-builder.yml); the packaging gates re-verify the payload
      # before anything publishes.
      - name: Build deb, pacman and AppImage bundles
        env:
          TUXBOOKS_SIDECAR_CACHE: gha
        run: |
          # Quoted: `package` takes one TARGETS argument; unquoted, just
          # would read the second token as another recipe to run.
          just package "deb pacman AppImage"

      # SBOM / dependency inventory (issue #89, S-4): CycloneDX over the
      # npm and Rust trees, uploaded with the release and covered by
      # SHA256SUMS.txt (docs/SUPPLY_CHAIN.md).
      - name: Generate SBOM
        run: just sbom

      - name: Verify packaging payloads
        run: |
          just check-deb
          just check-pacman
          just check-pacman-arch
          just check-appimage

      - name: Write SHA256SUMS.txt
        run: |
          cd dist-packages
          sha256sum tuxbooks_*.deb tuxbooks-*.pkg.tar.zst tuxbooks-*.AppImage SBOM-tuxbooks-*.cdx.json > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes are drafted from the commits since the previous tag
          # (scripts/release-notes.sh), polished, and committed with the
          # version bump, so the file exists at this tag. Refusing to
          # publish without it keeps the New / Changed / Fixed sections
          # from being forgotten (docs/RELEASE.md "Cutting a release").
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::missing $notes_file"
            echo "::error::run 'just release-notes $version', polish the draft, and commit it with the version bump"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "TuxBooks $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "dist-packages/tuxbooks_${version}_amd64.deb" \
            "dist-packages/tuxbooks-${version}-1-x86_64.pkg.tar.zst" \
            "dist-packages/tuxbooks-${version}.AppImage" \
            "dist-packages/SBOM-tuxbooks-${version}.cdx.json" \
            "dist-packages/SHA256SUMS.txt"
