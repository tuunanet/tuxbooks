name: Release

# Tags are immutable release points. Cut a release by: bumping the version
# in all manifests on main, letting CI go green, then tagging that commit
# (e.g. `git tag -a v0.1.1 && git push origin v0.1.1`). The workflow refuses
# to publish unless the tag exactly matches the version bundled below, so a
# stale or reused version can never produce a release. See the versioning
# policy under Milestone 11 in ROADMAP.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Release build (deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify the tag matches the bundled version
        run: |
          declared="$(jq -r .version src-tauri/tauri.conf.json)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the bundled version $declared"
            echo "::error::bump the version on main, let CI go green, then tag that commit"
            exit 1
          fi
          echo "Releasing $tagged"

      - name: Build Debian bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles deb

      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle/deb
          sha256sum tuxbooks_*.deb > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Development snapshot — TuxBooks is pre-1.0 and in active development.

          Install on Ubuntu/Debian:

          \`\`\`
          sudo apt install ./tuxbooks_${version}_amd64.deb
          \`\`\`

          SHA256SUMS.txt verifies the download. Build from source or read the
          plan: https://github.com/tuunanet/tuxbooks
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "TuxBooks $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file "$notes_file" \
            "src-tauri/target/release/bundle/deb/tuxbooks_${version}_amd64.deb" \
            "src-tauri/target/release/bundle/deb/SHA256SUMS.txt"
