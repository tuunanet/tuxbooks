name: Release

# Tags are immutable release points. Cut a release by: bumping the version
# in all manifests on main, letting CI go green, then tagging that commit
# (e.g. `git tag -a v0.1.1 && git push origin v0.1.1`). The workflow refuses
# to publish unless the tag exactly matches the version bundled below, so a
# stale or reused version can never produce a release. See docs/RELEASE.md
# and the versioning policy under Milestone 11 in ROADMAP.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag (tests + E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # xvfb is the only OS-level dependency the headless E2E suite needs
      # (docs/TESTING.md): Playwright launches the local Electron binary,
      # there is no external browser driver.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, pnpm, and the frozen dependencies (vp install runs frozen
      # under CI); cache: true caches the package-manager store. just
      # recipes call bare vp and pnpm --filter internally, which works with
      # the managed pnpm.
      - uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      # CI already ran the unit/integration suites (Rust and frontend) on the
      # commit this tag points at, and a tag is cut on a CI-gated commit on
      # main. This job adds the part CI never runs: the real-binary headless
      # E2E suites, so a tag never publishes what has not been proven.
      - name: E2E (headless)
        run: |
          bash scripts/fetch-pdfium.sh
          just test-e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  publish:
    name: Release build (deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, pnpm, and the frozen dependencies (vp install runs frozen
      # under CI); cache: true caches the package-manager store. just
      # recipes call bare vp and pnpm --filter internally, which works with
      # the managed pnpm.
      - uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Cache the Electron and electron-builder downloads (the packaging step
      # otherwise re-fetches them every release) and give the pinned-glibc
      # sidecar container a BuildKit layer cache in the Actions cache.
      - name: Electron cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Set up Buildx (sidecar container cache)
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Verify the tag matches the bundled version
        run: |
          declared="$(jq -r .version package.json)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the bundled version $declared"
            echo "::error::bump the version on main, let CI go green, then tag that commit"
            exit 1
          fi
          echo "Releasing $tagged"

      # The rpm needs rpmbuild; the deb and AppImage targets are
      # self-contained. AppImage bundling runs FUSE-free via
      # APPIMAGE_EXTRACT_AND_RUN — users need FUSE (or an extract-run
      # environment) only to execute the AppImage.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # deb for Ubuntu/Debian (primary target), AppImage for other Linux
      # setups. rpm stays a local `just package` artifact; the site's
      # audience is Ubuntu. electron-builder wires the sidecar binary and
      # the PDFium library into resources/sidecar (electron-builder.yml);
      # the packaging gate re-verifies the payload before anything publishes.
      - name: Build Debian and AppImage bundles
        env:
          TUXBOOKS_SIDECAR_CACHE: gha
        run: |
          # Quoted: `package` takes one TARGETS argument; unquoted, just
          # would read the second token as another recipe to run.
          just package "deb AppImage"

      # SBOM / dependency inventory (issue #89, S-4): CycloneDX over the
      # npm and Rust trees, uploaded with the release and covered by
      # SHA256SUMS.txt (docs/SUPPLY_CHAIN.md).
      - name: SBOM
        run: just sbom

      - name: Packaging gate
        run: just check-deb

      - name: Checksums
        run: |
          cd dist-packages
          sha256sum tuxbooks_*.deb tuxbooks-*.AppImage SBOM-tuxbooks-*.cdx.json > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          # Release notes are curated per release; rewrite them when the next
          # version is cut.
          cat > "$notes_file" <<EOF
          TuxBooks 0.1.0 is the first minor release: the basic functionality is in place, and the app is usable end to end for a real library of EPUB and PDF books.

          What changed since 0.0.24:

          - Bookmarks now have a home in book details. The Bookmarks tab sits next to Highlights, lists every bookmark with its chapter or page and when it was saved, and jumps the reader to that spot.
          - Bookmarking is quicker and less forgettable. Toggling a bookmark drops a small label box out of the toolbar button, so you can name the spot right away instead of hunting for it later. It shows where the bookmark sits (chapter and in-chapter progress for EPUB, page for PDF), and you can edit labels later from the drawer or the details tab.
          - The reader navigation moved to the right side, the Contents tab was renamed, and the toolbar order was tidied. Ctrl+F opens in-book search.
          - The PDF and EPUB readers, the library, and the release pipeline carry the fixes from the 0.0.21 to 0.0.24 cycle: a Spotlight-style in-book search, theme-aware highlights, more reliable watched-folder sync, and faster PDF scrolling.

          The next milestones are syncing your data across machines, improving the architecture, and optimizing performance. See the roadmap for what follows: https://github.com/tuunanet/tuxbooks/blob/main/ROADMAP.md

          Install on Ubuntu/Debian:

          \`\`\`
          sudo apt install ./tuxbooks_${version}_amd64.deb
          \`\`\`

          Or run the portable AppImage (no installation):

          \`\`\`
          chmod +x tuxbooks_${version}.AppImage
          ./tuxbooks_${version}.AppImage
          \`\`\`

          SHA256SUMS.txt verifies the downloads. Build from source or read the
          plan: https://github.com/tuunanet/tuxbooks
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "TuxBooks $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "dist-packages/tuxbooks_${version}_amd64.deb" \
            "dist-packages/tuxbooks-${version}.AppImage" \
            "dist-packages/SBOM-tuxbooks-${version}.cdx.json" \
            "dist-packages/SHA256SUMS.txt"
