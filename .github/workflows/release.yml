name: Release

# Tags are immutable release points. Cut a release by: bumping the version
# in all manifests on main, letting CI go green, then tagging that commit
# (e.g. `git tag -a v0.1.1 && git push origin v0.1.1`). The workflow refuses
# to publish unless the tag exactly matches the version bundled below, so a
# stale or reused version can never produce a release. See docs/release.md
# and the versioning policy under Milestone 11 in ROADMAP.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag (tests + E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-tauri-deps
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb webkit2gtk-driver

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install just
        uses: extractions/setup-just@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Same gates `just ci` runs before a build: unit/integration tests
      # (Rust + frontend) and the real-binary headless E2E suites. A tag
      # never publishes what main has not proven.
      - name: Unit and integration tests
        run: |
          pnpm install --frozen-lockfile
          just test

      - name: E2E (headless)
        run: just test-e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  publish:
    name: Release build (deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-tauri-deps

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify the tag matches the bundled version
        run: |
          declared="$(jq -r .version src-tauri/tauri.conf.json)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the bundled version $declared"
            echo "::error::bump the version on main, let CI go green, then tag that commit"
            exit 1
          fi
          echo "Releasing $tagged"

      - name: Fetch PDFium (bundled app resource)
        run: bash scripts/fetch-pdfium.sh

      # deb for Ubuntu/Debian (primary target), AppImage for other Linux
      # setups. rpm stays a local `just build` artifact; the site's audience
      # is Ubuntu. linuxdeploy is fetched by the bundler; APPIMAGE bundling
      # needs the librsvg2-dev pkg-config data (setup-tauri-deps provides it)
      # and runs FUSE-free via APPIMAGE_EXTRACT_AND_RUN.
      - name: Build Debian and AppImage bundles
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles deb appimage

      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/tuxbooks_*.deb appimage/tuxbooks_*.AppImage > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Development snapshot — TuxBooks is pre-1.0 and in active development.

          Install on Ubuntu/Debian:

          \`\`\`
          sudo apt install ./tuxbooks_${version}_amd64.deb
          \`\`\`

          Or run the portable AppImage (no installation):

          \`\`\`
          chmod +x tuxbooks_${version}_amd64.AppImage
          ./tuxbooks_${version}_amd64.AppImage
          \`\`\`

          SHA256SUMS.txt verifies the downloads. Build from source or read the
          plan: https://github.com/tuunanet/tuxbooks
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "TuxBooks $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file "$notes_file" \
            "src-tauri/target/release/bundle/deb/tuxbooks_${version}_amd64.deb" \
            "src-tauri/target/release/bundle/appimage/tuxbooks_${version}_amd64.AppImage" \
            "src-tauri/target/release/bundle/SHA256SUMS.txt"
