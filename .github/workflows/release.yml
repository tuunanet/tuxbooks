name: Release

# Tags are immutable release points. Cut a release by: bumping the version
# in all manifests on main, letting CI go green, then tagging that commit
# (e.g. `git tag -a v0.1.1 && git push origin v0.1.1`). The workflow refuses
# to publish unless the tag exactly matches the version bundled below, so a
# stale or reused version can never produce a release. See docs/release.md
# and the versioning policy under Milestone 11 in ROADMAP.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag (tests + E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # xvfb is the only OS-level dependency the headless E2E suite needs
      # (docs/testing.md): Playwright launches the local Electron binary,
      # there is no external browser driver.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install just
        uses: extractions/setup-just@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      # Same gates CI's check jobs run before a build: unit/integration
      # tests (Rust + frontend) and the real-binary headless E2E suites. A
      # tag never publishes what main has not proven.
      - name: Unit and integration tests
        run: |
          pnpm install --frozen-lockfile
          just test

      - name: E2E (headless)
        run: just test-e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  publish:
    name: Release build (deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [verify]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Verify the tag matches the bundled version
        run: |
          declared="$(jq -r .version package.json)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the bundled version $declared"
            echo "::error::bump the version on main, let CI go green, then tag that commit"
            exit 1
          fi
          echo "Releasing $tagged"

      # The rpm needs rpmbuild; the deb and AppImage targets are
      # self-contained. AppImage bundling runs FUSE-free via
      # APPIMAGE_EXTRACT_AND_RUN — users need FUSE (or an extract-run
      # environment) only to execute the AppImage.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # deb for Ubuntu/Debian (primary target), AppImage for other Linux
      # setups. rpm stays a local `just package` artifact; the site's
      # audience is Ubuntu. electron-builder wires the sidecar binary and
      # the PDFium library into resources/sidecar (electron-builder.yml);
      # the packaging gate re-verifies the payload before anything publishes.
      - name: Build Debian and AppImage bundles
        run: |
          pnpm install --frozen-lockfile
          # Quoted: `package` takes one TARGETS argument; unquoted, just
          # would read the second token as another recipe to run.
          just package "deb AppImage"

      - name: Packaging gate
        run: just check-deb

      - name: Checksums
        run: |
          cd dist-packages
          sha256sum tuxbooks_*.deb tuxbooks-*.AppImage > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Development snapshot — TuxBooks is pre-1.0 and in active development.

          Install on Ubuntu/Debian:

          \`\`\`
          sudo apt install ./tuxbooks_${version}_amd64.deb
          \`\`\`

          Or run the portable AppImage (no installation):

          \`\`\`
          chmod +x tuxbooks_${version}.AppImage
          ./tuxbooks_${version}.AppImage
          \`\`\`

          SHA256SUMS.txt verifies the downloads. Build from source or read the
          plan: https://github.com/tuunanet/tuxbooks
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "TuxBooks $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file "$notes_file" \
            "dist-packages/tuxbooks_${version}_amd64.deb" \
            "dist-packages/tuxbooks-${version}.AppImage" \
            "dist-packages/SHA256SUMS.txt"
