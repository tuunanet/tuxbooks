name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow always runs so its "CI gate" job is always reported and can be
# the single required branch-protection check. A workflow-level `paths-ignore`
# cannot do that: skipping the workflow leaves a required check pending forever
# and blocks the merge. Instead the `changes` job classifies the diff and the
# heavy jobs skip when every changed file is non-code: markdown (README, docs/,
# AGENTS.md, CONTEXT.md, ROADMAP.md, LICENSE.md), the static site (published by
# publish-site.yml), the bd tracker export, agent skills and config, the graft
# graph, the oracle, the reference submodule, and the ignore file. The gate
# treats a skipped job as a pass.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A merged PR fires both its pull_request run (head SHA) and a push run on
# the merge commit. When the branch was current, the merge commit has the
# exact tree the PR run already verified — re-running the whole pipeline on
# it is pure duplicate compute. Merged-PR pushes are therefore skipped: any
# job runs unless this is a push of a web-UI merge commit. Squash merges
# and direct pushes never match and always run (release.yml re-verifies
# tags with the full gate regardless).
env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        name: Classify the diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base...HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" \
            | grep -vE '\.md$|^\.gitignore$' \
            | grep -vE '^(docs/|site/|\.beads/|\.agents/|\.opencode/|\.codex/|graft/|oracle/|vendor/)' \
            | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash scripts/install-actionlint.sh
          .build/bin/actionlint

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm --filter frontend lint

      # Frontend + Electron main/preload (electron/tsconfig.json).
      - name: TypeScript
        run: pnpm typecheck

      - name: Vitest
        run: pnpm --filter frontend test:ci

  coverage:
    name: Coverage (frontend gate + badge)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      # Publish coverage-badge.json to the badges branch — used by the main
      # push step only (PR runs stop before publish).
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate is docs/COVERAGE.md's frontend floors (coverage.thresholds
      # in frontend/vite.config.ts): the run itself fails below any floor.
      # json-summary feeds scripts/coverage-badge.mjs.
      - name: Vitest with coverage
        run: pnpm --filter frontend exec vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary

      - name: Compute badge JSON
        run: node scripts/coverage-badge.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: frontend/coverage/

      # The only write to the badges branch; PR runs never reach this.
      - name: Publish badge JSON to badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --cached . --quiet
          mv frontend/coverage/coverage-badge.json ./coverage.json
          git add coverage.json
          git commit --message "coverage badge from ${GITHUB_SHA}"
          git push --force origin badges

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Fails fast when a large or non-deterministic fixture sneaked into the
      # committed corpus (docs/TESTING.md). No network access needed.
      - name: EPUB fixture guardrails
        run: python3 scripts/make-epub-fixtures.py --check

      # Pure Rust (no build.rs, no Node involvement — docs/ARCHITECTURE.md):
      # no Node/pnpm setup here, only the toolchain, the cargo cache, and
      # the PDFium shared library the PDF cover tests load.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      - name: Fetch PDFium (PDF cover tests)
        run: bash scripts/fetch-pdfium.sh

      - name: rustfmt
        run: cargo fmt --manifest-path sidecar/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path sidecar/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --manifest-path sidecar/Cargo.toml

  build:
    name: Release build (Electron shell + sidecar)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes, frontend, rust]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build (renderer + Electron bundles + release sidecar)
        run: |
          pnpm install --frozen-lockfile
          just build

      # Packaging gate (docs/RELEASE.md): a packaging regression fails the
      # build like any other test. CI verifies the deb target — self-contained,
      # no rpmbuild needed (only the rpm target wants it, see justfile
      # `package`); the rpm and AppImage are wired into the release
      # workflow's full `just package` run.
      - name: Package deb + packaging gate
        run: |
          just package deb
          just check-deb

  # The single required branch-protection check. It runs on every PR and main
  # push (`if: always()`), and it fails if any job above failed or was
  # cancelled. A skipped job (non-code change, or the merge-commit push) is a
  # pass, which is what lets lightweight changes merge without the heavy jobs.
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, workflows, frontend, coverage, rust, build]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Require every job to pass or be skipped
        run: |
          fail=0
          for entry in \
            "changes:${{ needs.changes.result }}" \
            "workflows:${{ needs.workflows.result }}" \
            "frontend:${{ needs.frontend.result }}" \
            "coverage:${{ needs.coverage.result }}" \
            "rust:${{ needs.rust.result }}" \
            "build:${{ needs.build.result }}"; do
            name="${entry%%:*}"; result="${entry##*:}"
            echo "$name: $result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name did not pass ($result)"; fail=1 ;;
            esac
          done
          exit "$fail"
