name: CI

on:
  push:
    branches: [main]
    # Nothing in CI consumes these: markdown (README, docs/, AGENTS.md,
    # LICENSE.md), the static site (published by publish-site.yml), and
    # ignore-file churn. Skips fire when EVERY changed file matches.
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        run: |
          bash scripts/install-actionlint.sh
          .build/bin/actionlint

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm --filter frontend lint

      # Frontend + Electron main/preload (electron/tsconfig.json).
      - name: TypeScript
        run: pnpm typecheck

      - name: Vitest
        run: pnpm --filter frontend test:ci

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Fails fast when a large or non-deterministic fixture sneaked into the
      # committed corpus (docs/testing.md). No network access needed.
      - name: EPUB fixture guardrails
        run: python3 scripts/make-epub-fixtures.py --check

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch PDFium (PDF cover tests)
        run: bash scripts/fetch-pdfium.sh

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Release build (Electron shell + sidecar)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build (renderer + Electron bundles + release sidecar)
        run: |
          pnpm install --frozen-lockfile
          just build

      # Packaging gate (docs/release.md): a packaging regression fails the
      # build like any other test. CI verifies the deb target; the rpm needs
      # rpmbuild and the AppImage needs APPIMAGE_EXTRACT_AND_RUN, both wired
      # into the release workflow's full `just package` run.
      - name: Package deb + packaging gate
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
          just package deb
          just check-deb
