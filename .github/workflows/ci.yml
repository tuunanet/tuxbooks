name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow always runs so its "CI gate" job is always reported and can be
# the single required branch-protection check. A workflow-level `paths-ignore`
# cannot do that: skipping the workflow leaves a required check pending forever
# and blocks the merge. Instead the `changes` job classifies the diff and the
# heavy jobs skip when every changed file is non-code: markdown (README, docs/,
# AGENTS.md, CONTEXT.md, ROADMAP.md, LICENSE.md), the static site (published by
# publish-site.yml), the bd tracker config, agent skills and config, the graft
# graph, the oracle, the reference submodule, and the ignore file. The gate
# treats a skipped job as a pass.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A merged PR fires both its pull_request run (head SHA) and a push run on
# the merge commit. Branch protection requires the branch to be up to date
# before merging, admins included, so the merge commit has the exact tree
# the PR run already verified. Re-running the whole pipeline on it is pure duplicate compute.
# Merged-PR pushes are therefore skipped: any job runs unless this is a push
# of a web-UI merge commit. Squash merges and direct pushes never match and
# always run. If branch protection ever stops requiring an up-to-date
# branch, remove the skip: a stale PR's merge commit would then go
# unverified.
env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: classify
        name: Classify the diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base...HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" \
            | grep -vE '\.md$|^\.gitignore$' \
            | grep -vE '^(docs/|site/|\.beads/|\.agents/|\.opencode/|graft/|oracle/|vendor/)' \
            | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "packaging=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Packaging-relevant paths: anything that lands in, or configures,
          # the payload the packaging gates inspect (Electron shell, sidecar,
          # builder config). A frontend-only change cannot alter what
          # check-deb.sh, check-pacman.sh or check-appimage.sh verifies, so
          # the build job skips the packaged builds and compiles the sidecar
          # on the host instead of in the pinned container.
          if printf '%s\n' "$changed" \
            | grep -qE '^(electron/|sidecar/|build/|scripts/(check-deb\.sh|check-pacman\.sh|check-pacman-arch\.sh|check-appimage\.sh|build-sidecar-release\.sh|sidecar-build\.Dockerfile|build-electron\.mjs|fetch-pdfium\.sh)|electron-builder\.yml|package\.json|pnpm-lock\.yaml|justfile|\.github/workflows/release\.yml)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        run: |
          bash scripts/install-actionlint.sh
          .build/bin/actionlint

  frontend:
    name: Frontend (format, lint, typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Electron's postinstall downloads the runtime zip from GitHub
      # releases, which has 504'd and failed `vp install` inside setup-vp
      # (job 129012476756, PR #399). Restoring the cache first makes that
      # download local on every run after the first; the key follows the
      # lockfile and builder config that pin the version.
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, and the frozen dependencies; cache: true caches the
      # package-manager store.
      - name: Install vp toolchain
        uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      - name: Check formatting (oxfmt)
        run: vp fmt --check .

      - name: Lint frontend (oxlint)
        run: vp lint

      # Frontend + Electron main/preload (electron/tsconfig.json).
      - name: Typecheck (frontend, Electron, E2E)
        run: pnpm typecheck

  # The coverage job owns the frontend test run: it executes the full vp
  # test (vitest) suite with coverage and fails on any test failure or floor
  # breach (docs/COVERAGE.md). The lint/typecheck job above no longer re-runs
  # the same suite.

  coverage:
    name: Frontend tests (coverage + badge)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      # Publish coverage-badge.json to the badges branch — used by the main
      # push step only (PR runs stop before publish).
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Electron cache (see the frontend job): vp install's electron
      # postinstall fetches the runtime zip from GitHub releases, which has
      # 504'd and failed this job (job 129012476756, PR #399).
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, and the frozen dependencies; cache: true caches the
      # package-manager store.
      - name: Install vp toolchain
        uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      # The gate is docs/COVERAGE.md's frontend floors (coverage.thresholds
      # in frontend/vite.config.ts): the run itself fails below any floor.
      # json-summary feeds scripts/coverage-badge.mjs.
      - name: Run frontend tests with coverage
        run: vp -C frontend test run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary

      - name: Compute coverage badge JSON
        run: node scripts/coverage-badge.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: frontend/coverage/

      # The only write to the badges branch; PR runs never reach this.
      - name: Publish badge JSON to badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --cached . --quiet
          mv frontend/coverage/coverage-badge.json ./coverage.json
          git add coverage.json
          git commit --message "coverage badge from ${GITHUB_SHA}"
          git push --force origin badges

  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fails fast when a large or non-deterministic fixture sneaked into the
      # committed corpus (docs/TESTING.md). No network access needed.
      - name: Validate EPUB fixtures
        run: python3 scripts/make-epub-fixtures.py --check

      # Pure Rust (no build.rs, no Node involvement — docs/ARCHITECTURE.md):
      # no Node/pnpm setup here, only the toolchain, the cargo cache, and
      # the PDFium shared library the PDF cover tests load.
      # SHA-pinned (#93); with a SHA ref dtolnay/rust-toolchain takes the
      # channel from the toolchain input instead of the ref name.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      # GitHub releases 504s have failed this download (PR #399); cache the
      # fetched library across runs. Exact key only — no restore-keys: the
      # key follows fetch-pdfium.sh, which pins the build, and a stale entry
      # from a different build would be silently accepted by the script's
      # already-present check.
      - name: Cache PDFium library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: sidecar/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-pdfium.sh') }}

      - name: Fetch PDFium (PDF cover tests)
        run: bash scripts/fetch-pdfium.sh

      - name: Check Rust formatting (rustfmt)
        run: cargo fmt --manifest-path sidecar/Cargo.toml --check

      - name: Lint Rust (clippy)
        run: cargo clippy --manifest-path sidecar/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path sidecar/Cargo.toml

  build:
    name: Release build (Electron, sidecar, packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only the diff classifier gates this job. It runs in parallel with the
    # lint/test jobs against the same commit instead of waiting behind them,
    # so the multi-minute build is no longer serialized after the tests.
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # electron-builder re-downloads Electron and its helper tooling on every
      # run. Cache the downloads; the key follows the lockfile and builder
      # config that pin the versions.
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # Installs vp (the version pinned by the project catalog), its Node.js
      # runtime, pnpm, and the frozen dependencies (vp install runs frozen
      # under CI); cache: true caches the package-manager store. The justfile
      # recipes call bare vp and pnpm --filter internally, which works with
      # the managed pnpm.
      - name: Install vp toolchain
        uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version: 24
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sidecar

      # just comes from scripts/install-just.sh (the install-actionlint.sh
      # house pattern: pinned + checksum-verified tarball, curl retry sized
      # for GitHub-releases 504 brownouts). setup-just's ~24s of built-in
      # retries were exhausted twice by those brownouts (PRs #399, #400).
      - name: Install just
        run: |
          bash scripts/install-just.sh
          echo "$GITHUB_WORKSPACE/.build/bin" >> "$GITHUB_PATH"

      # The pinned-glibc container sidecar exists so the packaging gate can
      # check the ABI floor on the deb. A change that cannot reach the deb
      # payload compiles the sidecar on the host instead: same compile,
      # seconds instead of minutes.
      - name: Set up Buildx (sidecar container cache)
        if: needs.changes.outputs.packaging == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build app bundles and release sidecar
        env:
          TUXBOOKS_SIDECAR_CACHE: ${{ needs.changes.outputs.packaging == 'true' && 'gha' || '' }}
          TUXBOOKS_SIDECAR_HOST_BUILD: ${{ needs.changes.outputs.packaging == 'true' && '0' || '1' }}
        run: just build

      # fpm builds Arch packages with bsdtar (for .MTREE) and zstd (the
      # tarball). Debian/Ubuntu ship bsdtar in libarchive-tools, not under
      # the upstream `bsdtar` package name.
      - name: Install pacman packaging tooling
        if: needs.changes.outputs.packaging == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools zstd

      # Packaging gates (docs/RELEASE.md): a packaging regression fails the
      # build like any other test. CI verifies the deb, pacman and AppImage
      # targets, self-contained, with no rpmbuild needed (only the rpm target
      # wants it, see justfile `package`); the rpm stays a local artifact.
      # The pacman dependency resolution runs in an Arch container, so it
      # catches a package Arch has dropped as well as a payload regression.
      # Skipped when the change cannot reach the packaged payload.
      - name: Package deb, pacman and AppImage, verify payloads
        if: needs.changes.outputs.packaging == 'true'
        run: |
          just package "deb pacman AppImage"
          just check-deb
          just check-pacman
          just check-pacman-arch
          just check-appimage

  # The single required branch-protection check. It runs on every PR and main
  # push (`if: always()`), and it fails if any job above failed or was
  # cancelled. A skipped job (non-code change, or the merge-commit push) is a
  # pass, which is what lets lightweight changes merge without the heavy jobs.
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, workflows, frontend, coverage, rust, build]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Require every job to pass or be skipped
        run: |
          fail=0
          for entry in \
            "changes:${{ needs.changes.result }}" \
            "workflows:${{ needs.workflows.result }}" \
            "frontend:${{ needs.frontend.result }}" \
            "coverage:${{ needs.coverage.result }}" \
            "rust:${{ needs.rust.result }}" \
            "build:${{ needs.build.result }}"; do
            name="${entry%%:*}"; result="${entry##*:}"
            echo "$name: $result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name did not pass ($result)"; fail=1 ;;
            esac
          done
          exit "$fail"
