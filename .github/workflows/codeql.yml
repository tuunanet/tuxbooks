name: CodeQL

# CodeQL advanced setup (replaced the default-setup matrix, which ran every
# language on every PR and gated PR wall time on the ~7-minute Rust
# extraction). The split by event:
#
# - javascript-typescript — every PR and every main push. The renderer is
#   exposed to file contents (EPUB/PDF parsing in JS), so it stays on the
#   PR path; at ~1 minute it runs beside CI, invisible.
# - rust — every PR and every main push, plus the weekly schedule. The
#   sidecar is the true attack surface (it parses untrusted documents), so
#   its deep scan has to run when the sidecar changes, not up to a week
#   later. It used to be main+weekly only because extraction re-pays a full
#   cargo build per head SHA (the reason advanced setup replaced the
#   default-setup matrix); the cargo cache keyed on sidecar/Cargo.lock
#   (below) should cut a hit well under that ~7-minute full extraction, a
#   miss pays full price, and JS-only PRs pay only the cache lookup. Clippy
#   (`just check`, CI) remains the required PR gate; this workflow stays
#   advisory.
#
# Both languages upload on every PR on purpose: the code-scanning check
# compares the categories the PR uploaded against the base branch, so a
# skipped rust upload leaves the check neutral ("1 configuration not
# found"). Path-filtering rust to Rust-only PRs would not fix that — every
# PR has to run both.
#
# python and actions are intentionally absent: the Python footprint is five
# dev-tooling scripts (~2.4k lines, fixture generation, nothing shipped),
# and the workflows are validated by actionlint on every PR (ci.yml) —
# CodeQL's actions queries added template-injection checks over three small
# hand-reviewed files at ~45s per run.
#
# `paths-ignore` covers the same non-code paths ci.yml skips as jobs: markdown,
# the site, the bd tracker export, agent skills and config, the graft graph,
# the oracle, and the reference submodule. This workflow is advisory, so it can
# skip wholesale; the required "CI gate" lives in ci.yml and always runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
      - ".beads/**"
      - ".agents/**"
      - ".opencode/**"
      - "graft/**"
      - "oracle/**"
      - "vendor/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
      - ".beads/**"
      - ".agents/**"
      - ".opencode/**"
      - "graft/**"
      - "oracle/**"
      - "vendor/**"
  schedule:
    # Weekly deep scan (rust included) on Monday morning UTC.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip the duplicate run a merged PR fires on the merge-commit push: the
# head SHA was already verified by the pull_request run (same rationale as
# ci.yml; default setup could not express this).
jobs:
  analyze-javascript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:javascript-typescript"

  # PR + main-push deep scan (weekly stays as the cold-cache full build).
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The implicit autobuild extracts the sidecar by running its cargo
      # build and re-pays it per head SHA. Cache the registry sources and
      # the build dir, keyed on the sidecar lockfile, so unchanged
      # dependencies come back fresh instead of recompiling. Deliberately a
      # plain lockfile-keyed actions/cache rather than the
      # Swatinem/rust-cache action ci.yml and release.yml use: CodeQL
      # drives the build here, so only the registry and build dir need
      # restoring. The action is already in the tree (ci.yml, release.yml);
      # SHA-pinned here like everything else in this file, so S-5
      # (docs/SUPPLY_CHAIN.md) needs no new allowance.
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            sidecar/target
          key: ${{ runner.os }}-codeql-rust-${{ hashFiles('sidecar/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-codeql-rust-

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: rust

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:rust"
