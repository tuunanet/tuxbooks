name: CodeQL

# CodeQL advanced setup (replaced the default-setup matrix, which ran every
# language on every PR and gated PR wall time on the ~7-minute Rust
# extraction). The split by event:
#
# - javascript-typescript — every PR and every main push. The renderer is
#   exposed to file contents (EPUB/PDF parsing in JS), so it stays on the
#   PR path; at ~1 minute it runs beside CI, invisible.
# - rust — main pushes and the weekly schedule only, never PRs. The sidecar
#   is the true attack surface (it parses untrusted documents), but its
#   extraction re-pays a full cargo build per head SHA, which is too
#   expensive to block a PR on. Clippy (`just check`, CI) covers PR-time
#   linting; the deep scan still lands weekly and on every main merge.
#
# python and actions are intentionally absent: the Python footprint is five
# dev-tooling scripts (~2.4k lines, fixture generation, nothing shipped),
# and the workflows are validated by actionlint on every PR (ci.yml) —
# CodeQL's actions queries added template-injection checks over three small
# hand-reviewed files at ~45s per run.
#
# `paths-ignore` mirrors ci.yml so docs-only/site-only changes skip this
# workflow entirely (default setup ignored it).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
  schedule:
    # Weekly deep scan (rust included) on Monday morning UTC.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip the duplicate run a merged PR fires on the merge-commit push: the
# head SHA was already verified by the pull_request run (same rationale as
# ci.yml; default setup could not express this).
jobs:
  analyze-javascript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # Weekly + main-push deep scan.
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'schedule' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: rust

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
