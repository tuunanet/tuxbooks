name: CodeQL

# CodeQL advanced setup (replaced the default-setup matrix, which ran every
# language on every PR and gated PR wall time on the ~7-minute Rust
# extraction). The split by event:
#
# - javascript-typescript — every PR and every main push. The renderer is
#   exposed to file contents (EPUB/PDF parsing in JS), so it stays on the
#   PR path; at ~1 minute it runs beside CI, invisible.
# - rust — every main push and the weekly schedule, plus PRs that touch the
#   sidecar (the `changes` job classifies the diff; ci.yml uses the same
#   shape). The sidecar is the true attack surface (it parses untrusted
#   documents), so the scan still lands on main and weekly; on the PR path it
#   runs only when the diff can contain Rust, because extraction costs ~6
#   minutes warm even with the cargo cache below and it has produced no
#   findings. A JS-only PR skips it and uploads only the js category.
#
# A JS-only PR therefore reports the code-scanning check as neutral ("1
# configuration not found"): the check compares the categories the PR
# uploaded against the base branch, and rust is missing. Neutral does not
# block a merge (this workflow is advisory; the required "CI gate" is
# ci.yml's), so the ~6 minutes saved on every JS-only PR is worth the
# cosmetic neutral. This reverses the earlier decision to run rust on every
# PR, which was made to clear that check before its cost was measured.
# Clippy (`just check`, CI) remains the required PR-time rust gate.
#
# python and actions are intentionally absent: the Python footprint is five
# dev-tooling scripts (~2.4k lines, fixture generation, nothing shipped),
# and the workflows are validated by actionlint on every PR (ci.yml) —
# CodeQL's actions queries added template-injection checks over three small
# hand-reviewed files at ~45s per run.
#
# `paths-ignore` covers the same non-code paths ci.yml skips as jobs: markdown,
# the site, the bd tracker config, agent skills and config, the graft graph,
# the oracle, and the reference submodule. This workflow is advisory, so it can
# skip wholesale; the required "CI gate" lives in ci.yml and always runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
      - ".beads/**"
      - ".agents/**"
      - ".opencode/**"
      - "graft/**"
      - "oracle/**"
      - "vendor/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - ".gitignore"
      - ".beads/**"
      - ".agents/**"
      - ".opencode/**"
      - "graft/**"
      - "oracle/**"
      - "vendor/**"
  schedule:
    # Weekly deep scan (rust included) on Monday morning UTC.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip the duplicate run a merged PR fires on the merge-commit push: the
# head SHA was already verified by the pull_request run (same rationale as
# ci.yml; default setup could not express this).
jobs:
  # Classify the PR diff to decide whether the rust deep scan runs. Same
  # first-party shape as ci.yml's `changes` job (no third-party paths-filter
  # action, which the S-5 maturity gate would have to review). Rust stays on
  # every main push and the weekly cron regardless; only the PR path is
  # filtered, because that is where the ~6-minute extraction cost lands on
  # every change. The classifier is cheap (~5s) and always runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: classify
        name: Classify the diff
        run: |
          set -euo pipefail
          # Only a pull_request diff can skip the rust scan. A push to main or
          # the weekly schedule always scans: those are the deep-scan paths and
          # nothing is waiting on them.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base...HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          # The rust extractor only reads the sidecar crate. Anything under
          # sidecar/ can change what it compiles, so scan; a diff confined to
          # frontend/electron/e2e/docs has no Rust for it to extract.
          if printf '%s\n' "$changed" | grep -q '^sidecar/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-javascript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:javascript-typescript"

  # Deep scan: every main push, the weekly schedule, and PRs whose diff
  # touched the sidecar (needs.changes above). A JS-only PR skips it and the
  # code-scanning check goes neutral, which does not block (see header).
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: github.event_name == 'schedule' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request')) || (github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true')
    permissions:
      security-events: write
      contents: read
    # The implicit autobuild extracts the sidecar by running its cargo
    # build and re-pays it per head SHA. By default the Rust extractor
    # builds into a throwaway scratch dir (the run log shows
    # `cargo_target_dir: None`), so a cache over sidecar/target saves only
    # the ~68MB crate registry and none of the compile. Point the
    # extractor at a persistent dir instead (option cargo_target_dir, set
    # via the documented CODEQL_EXTRACTOR_<LANG>_OPTION_<NAME> env var) so
    # the cached build artifacts are what the next run reuses. The
    # extractor's own docs say a persistent target dir "may reduce
    # execution time of consecutive extractor runs", i.e. CodeQL is built
    # to reuse a warm dir, unlike a hand-pointed sidecar/target.
    env:
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/codeql-rust-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cache the crate registry and the extractor's persistent build dir,
      # keyed on the sidecar lockfile. The -v2 key segment forces one
      # fresh save: the pre-v2 entry is registry-only (68MB) and a cache
      # key is immutable, so keeping the old key would restore it forever
      # and never persist the compile. Deliberately a plain lockfile-keyed
      # actions/cache rather than the Swatinem/rust-cache action ci.yml and
      # release.yml use: CodeQL drives the build here, so only the registry
      # and build dir matter. First-party action, already in the tree
      # (ci.yml, release.yml); SHA-pinned here like everything else in this
      # file, so S-5 (docs/SUPPLY_CHAIN.md) needs no new allowance.
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            codeql-rust-target
          key: ${{ runner.os }}-codeql-rust-v2-${{ hashFiles('sidecar/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-codeql-rust-v2-

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: rust

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:rust"
