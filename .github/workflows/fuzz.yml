name: Fuzz (nightly)

# Issue #88: fuzzing runs at nightly cadence, never per-PR
# (docs/TESTING.md "Fuzzing"). Each target is time-boxed; a crash fails the
# job and uploads the artifact for triage.
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz targets (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned nightly (issue #89, S-1): a floating nightly is an
      # uncontrolled dependency. Bump the date deliberately, one bump per
      # change, and run `just fuzz-ci` locally once before pushing.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-08-15

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            sidecar
            sidecar/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Fuzz (bounded, five minutes per target)
        run: just fuzz-ci

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: sidecar/fuzz/artifacts/
          if-no-files-found: ignore
