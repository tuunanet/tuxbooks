# Dependabot.
#
# Weekly npm dependency updates. GitHub-Actions updates stay enabled — the
# workflow files are small and isolated. The Rust sidecar (sidecar/Cargo.toml)
# is intentionally not registered here: cargo updates are taken deliberately
# by hand, not by automation.
#
# Retired decisions (2026-10-22, the vite-plus migration, all resolved by the
# same change):
#
# - The `vitest` and `@vitest/coverage-*` ignores (PR #12) are gone. vitest 5
#   arrives through vite-plus with the coverage instrument re-proven: the v5
#   run matches the v4 run per file (122/122 files; worst lines% delta 0.15pp;
#   identical 92.55% total) and passes every docs/COVERAGE.md floor. The
#   provider moves welded to vitest in the vite-plus toolchain catalog.
# - The `vite` ignore (PR #19) is gone. vite 8 enters as @voidzero-dev/
#   vite-plus-core behind the vite-plus catalog alias, so exactly one Vite
#   lives in the tree — the two-Vite tsc clash cannot recur. The PDFium WASM
#   asset-emission seam (virtual:pdfium-wasm-url, docs/PDF.md) is re-proven
#   under Rolldown: the vp build emits the hashed pdfium.wasm asset, and the
#   node integration test renders through the real WASM.
# - The `@vitejs/plugin-react` ignore (PR #26) is gone: 6.x rode this
#   migration, as planned.
# - The `typescript` ignore (PR #28) is gone. Its only blocker was the
#   typescript-eslint peer (8.x hard-exits on TS 7); the migration removed
#   typescript-eslint (Oxlint replaces it), so the frontend now runs
#   typescript ^7.0.2 like the root.
#
# Toolchain packages (vite-plus, vitest, vite, @vitest/*) are catalog-managed
# in pnpm-workspace.yaml and move with vite-plus releases (`vp up`), not with
# Dependabot; Dependabot PRs for them would be noise.
#
# The `@types/node` ignore (2026-09-10, PR #32): Node 26 types typecheck
# ahead of the runtime — Electron 44 embeds Node 24.18.1, and electron
# main/preload compile against these types, so a 25/26 bump would silently
# admit Node-26-only APIs the shipped runtime does not have (CI cannot catch
# that). The 24.x line tracks the embedded runtime; take 24.x patches
# normally. Revisit when an Electron upgrade embeds Node >= 25 (check the
# release notes' Node version), then lift this ignore and take the types
# bump in the same session as the Electron bump.
#
# Minor+patch npm updates are grouped into one PR (the 2026-09-10 batch was
# nine separate PRs for eight packages); majors stay individual because they
# are exactly the ones that need scrutiny. GitHub-Actions updates are grouped
# wholesale — same-file, low-risk bumps.
#
# The `cooldown` is the supply-chain decision (2026-09-11): Dependabot's
# default 3-day cooldown only guards against bleeding-edge releases; 30 days
# gives the community time to detect and pull compromised versions before we
# ever see a PR (the Shai-Hulud pattern). Security updates bypass cooldown
# by design — that is the urgent-fix path at the Dependabot layer. The
# install-time half of this policy is `minimumReleaseAge` in
# pnpm-workspace.yaml (gates manual updates and transitive deps, which
# Dependabot cannot see); its `minimumReleaseAgeExclude` is the urgent-fix
# path there. Only a patched release of an already-vulnerable version
# qualifies for either exclude list, never a routine bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    reviewers:
      - "tuunanet"
    ignore:
      # Toolchain packages live in the pnpm-workspace.yaml catalog and move
      # with vite-plus releases (`vp up`), welded to one tested train. A
      # Dependabot bump of one member alone would desync the toolchain.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      # Types must not run ahead of Electron's embedded Node (PR #32, see
      # above).
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "tuunanet"
    # Same supply-chain floor as npm (see above): workflow-pin attacks ride
    # moved tags (the tj-actions pattern), and these bumps are grouped
    # wholesale — a fresh compromised release must age 30 days first.
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns:
          - "*"
