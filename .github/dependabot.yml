# Dependabot (docs: the vitest-4 investigation is recorded on PR #12).
#
# Weekly npm dependency updates. GitHub-Actions updates stay enabled — the
# workflow files are small and isolated. The Rust sidecar (sidecar/Cargo.toml)
# is intentionally not registered here: cargo updates are taken deliberately
# by hand, not by automation.
#
# The `vitest` ignore is the PR #12 decision: vitest 4's coverage instrument
# (AST remapping, both providers) cannot attribute TSX statement coverage the
# way v3 did, which would break the docs/coverage.md gate for five categories
# (books, layout, settings, lib, hooks) without any real coverage loss.
# Revisit when ast-v8-to-istanbul attributes JSX-transformed statements
# correctly — until then every vitest >= 4 PR is noise.
#
# The @vitest/coverage-* ignore is the same decision, other end of the
# marriage: the provider is version-welded to vitest, so it must move in the
# same migration (PR #21 proposed 5.0.0 against vitest 3.2.7).
#
# The `vite` ignore is the PR #19 decision: vite 8 cannot enter while vitest
# 3.2.7 peers on vite ^5..^7 — pnpm keeps two Vites in the tree and tsc dies
# on the plugin type clash (Rolldown-Vite vs Rollup-Vite). The MuPDF WASM
# asset-emission seam (virtual:mupdf-wasm-url, docs/pdf.md) also must be
# re-proven under Rolldown before vite 8 lands. Bump vite together with the
# vitest migration, not before.
#
# The `typescript` ignore is the PR #28 decision: TS 7 is the typescript-go
# rewrite; typescript-eslint 8.x refuses to run on it ("does not support TS
# 7.0" — hard exit in the lint stream, PR #28). One major at a time: land 6.x
# when typescript-eslint supports it, then evaluate 7. Widen the ignored
# range as the toolchain catches up.
#
# Minor+patch npm updates are grouped into one PR (the 2026-09-10 batch was
# nine separate PRs for eight packages); majors stay individual because they
# are exactly the ones that need scrutiny. GitHub-Actions updates are grouped
# wholesale — same-file, low-risk bumps.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "tuunanet"
    # PR #12 (2026-09-10): deferred, see above. Bump the ignored version
    # ranges together with that decision.
    ignore:
      - dependency-name: "vitest"
        versions: [">=4"]
      - dependency-name: "@vitest/coverage-*"
        versions: [">=4"]
      - dependency-name: "vite"
        versions: [">=8"]
      # PR #28: TS 7 blocked by typescript-eslint (see above).
      - dependency-name: "typescript"
        versions: [">=7"]
      # PR #26: plugin-react 6.x peers vite ^8 only — rides the vite/vitest
      # migration.
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "tuunanet"
    groups:
      actions:
        patterns:
          - "*"
