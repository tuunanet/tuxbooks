[package]
name = "tuxbooks"
version = "0.0.1"
description = "Local-first ebook library manager"
authors = ["tuxbooks"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.82"

# See docs/architecture.md for the module layout contract.
[lib]
name = "tuxbooks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `custom-protocol` embeds `frontendDist` assets into the binary (what `tauri build`
# passes). Without it, debug binaries load `build.devUrl` (the Vite dev server).
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Desktop polish (milestone 10): restores window size/position across restarts.
tauri-plugin-window-state = "2"
# "Show in File Manager" reveal action (milestone 10).
tauri-plugin-opener = "2"
# Test-only WebDriver helpers (execute/mocking/log forwarding) for
# @wdio/tauri-service. Registered in debug builds only (see lib.rs); kept as a
# non-optional dependency so the `wdio:default` capability permission resolves
# in release builds too.
tauri-plugin-wdio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
# Filesystem watching for library reconciliation (ROADMAP milestone 3):
# inotify events are debounced and reconciled incrementally by
# services/library_watcher.rs; there is no other way to keep the library in
# sync without full rescans.
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# PDF metadata via a pure-Rust object reader (no rendering engine).
lopdf = "0.44"
# PDF cover extraction: rasterizes page 1 at import time. pdfium-render is
# bindings-only; the PDFium shared library is fetched by
# scripts/fetch-pdfium.sh and probed at runtime (see docs/build.md).
pdfium-render = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

# Debug builds compile dependencies optimized. Unoptimized lopdf/image/png
# made a 25-PDF import take ~15s in dev (vs ~3s release); tuxbooks' own code
# stays unoptimized for fast iteration and debuggability.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1
