[package]
name = "tuxbooks"
version = "0.1.0"
description = "Local-first ebook library manager"
authors = ["tuxbooks"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.82"

# See docs/architecture.md for the module layout contract.
[lib]
name = "tuxbooks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `custom-protocol` embeds `frontendDist` assets into the binary (what `tauri build`
# passes). Without it, debug binaries load `build.devUrl` (the Vite dev server).
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Test-only WebDriver helpers (execute/mocking/log forwarding) for
# @wdio/tauri-service. Registered in debug builds only (see lib.rs); kept as a
# non-optional dependency so the `wdio:default` capability permission resolves
# in release builds too.
tauri-plugin-wdio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# PDF support is metadata-only (title/author/subject for library indexing);
# lopdf is a pure-Rust object reader with no rendering engine.
lopdf = "0.44"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
