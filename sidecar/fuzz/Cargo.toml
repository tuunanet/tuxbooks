[package]
name = "tuxbooks-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dependencies.tuxbooks]
path = ".."

[[bin]]
name = "epub-parse"
path = "fuzz_targets/epub_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opf-xml"
path = "fuzz_targets/opf_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf-parse"
path = "fuzz_targets/pdf_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json-rpc"
path = "fuzz_targets/json_rpc.rs"
test = false
doc = false
bench = false
