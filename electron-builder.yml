# Electron packaging (docs/RELEASE.md).
# The deb/pacman/AppImage artifact set, the version source of truth
# (package.json version), and the packaging-gate philosophy carry over from
# the Tauri era; only the build internals changed.
appId: com.tuxbooks.app
productName: TuxBooks
copyright: GPL-3.0-or-later

# The published AppImage name is pinned to the lowercase technical
# identifier (docs/RELEASE.md artifact table, the release workflow's
# checksums + upload globs); electron-builder's default would derive
# `TuxBooks-<version>.AppImage` from the productName. Top-level block:
# per-target options (like deb/pacman) are siblings of the platform
# sections, and linux.artifactName would also rename the deb.
appImage:
  artifactName: tuxbooks-${version}.${ext}

# The Arch/Manjaro package (electron-builder's pacman target, beta upstream).
# fpm assembles it, so the build host needs bsdtar and zstd (Debian/Ubuntu:
# libarchive-tools and zstd). The depends list below is not electron-builder's
# default: that list mirrors Arch's `electron` package, which links system
# libraries, while the electron-builder runtime ships its own ffmpeg/event/
# codec libraries and links only the X/GTK stack. It also still names
# http-parser and libappindicator-gtk3, which Arch removed. The list here is
# the direct ELF requirements of the packaged binary (readelf NEEDED) plus
# hicolor-icon-theme and xdg-utils; namcap on the built package is clean.
# scripts/check-pacman.sh asserts the metadata, payload, and glibc floor.
pacman:
  # Match the metadata fpm writes (pkgver includes the default pkgrel 1) and
  # the release workflow's checksum and upload globs. Releases build x64 only,
  # like the other artifacts.
  artifactName: tuxbooks-${version}-1-x86_64.pkg.tar.zst
  # electron-builder passes xz by default; Arch packages use zstd.
  compression: zstd
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - glib2
    - glibc
    - gtk3
    - hicolor-icon-theme
    - libcups
    - libgcc
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    - xdg-utils

# The AppImage runtime binary (docs/RELEASE.md "AppImage specifics"). 0.0.0,
# the default, dlopen()s libfuse.so.2, which Ubuntu 22.04+ no longer installs
# (24.04 renamed the package to libfuse2t64); 1.0.3 embeds AppImage's static
# type2-runtime, so the host needs only the fusermount3 helper. 1.0.3 rather
# than 1.0.2 also carries the electron-builder#9598 fix.
# scripts/check-appimage.sh asserts the shipped runtime stays static.
toolsets:
  appimage: "1.0.3"

directories:
  output: dist-packages
  buildResources: build

# The renderer is loaded from app.asar (frontend/dist) and the main/preload
# bundles sit in app.asar/electron/dist; main resolves both relative to its
# own __dirname. The sidecar is a real process: it must live outside the
# asar in extraResources, next to the PDFium library it probes at startup
# (sidecar/src/lib.rs pdfium_library_dirs includes the binary's directory).
files:
  - electron/dist/**
  - frontend/dist/**
  - package.json

extraResources:
  - from: sidecar/target/release/tuxbooks
    to: sidecar/tuxbooks
  # The sandboxed document worker (ADR 0001): the sidecar locates it next
  # to its own binary (worker::client::locate).
  - from: sidecar/target/release/tuxbooks-worker
    to: sidecar/tuxbooks-worker
  - from: sidecar/pdfium/libpdfium.so
    to: sidecar/libpdfium.so
  # The native window/taskbar icon at runtime (electron/main/index.ts
  # appIconPath): the canonical build/icons set copied out of the asar.
  - from: build/icons
    to: icons

linux:
  category: Utility
  maintainer: Tuomo Tuunanen <47913151+tuunanet@users.noreply.github.com>
  vendor: tuxbooks
  description: Local-first ebook library and reader
  synopsis: Local-first ebook library and reader
  # The human-facing name is TuxBooks; the executable (and with it the
  # /opt/tuxbooks install layout and desktop Exec path) stays the stable
  # technical identifier.
  executableName: tuxbooks
  target:
    - deb
    - pacman
    - AppImage
  icon: build/icons/
  desktop:
    entry:
      Type: Application
      Terminal: false
      Categories: Office;Viewer;Literature;
      Keywords: ebook;epub;pdf;library;reader;
