<!doctype html>
<meta charset="utf-8" />
<title>pdfium spike</title>
<script>
  window.__spike = (msg) =>
    new Promise((resolve, reject) => {
      const worker = new Worker("/worker.js");
      worker.onmessage = (e) => {
        if (e.data.type === "report") {
          worker.terminate();
          resolve(e.data.report);
        } else if (e.data.type === "progress") {
          console.log("spike-progress: " + e.data.step);
        } else if (e.data.type === "error") {
          worker.terminate();
          reject(new Error(e.data.error));
        }
      };
      worker.onerror = (e) => {
        worker.terminate();
        reject(new Error(e.message || "worker error"));
      };
      worker.postMessage({ type: "run", ...msg });
    });
</script>
