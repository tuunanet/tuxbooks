    <title>Semantic Structure</title>

  <body>
    <section>
      <h1>Semantic Structure</h1>
      <article>
        <h2>An Article</h2>
        <p>This chapter exercises <code>section</code>, <code>article</code>, <code>figure</code>, <code>aside</code>, and <code>time</code>.</p>
        <figure>
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#2563eb"/></svg>
          <figcaption>Figure 1: a tiny inline SVG.</figcaption>
        </figure>
      </article>
      <aside epub:type="note">A marginal note marked up as an aside.</aside>
      <p>Written <time datetime="2024-01-01">New Year 2024</time>.</p>
    </section>
  </body>
